<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recuperar Contraseña | Hospital Público Manolo Morales</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Material Symbols -->

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/assets/css/forgot-password.css">

</head>

<body>

    <!--==================================
            FONDO
    ===================================-->

    <div class="background">

        <div class="background-circle circle-1"></div>

        <div class="background-circle circle-2"></div>

    </div>

    <!--==================================
            RECUPERAR CONTRASEÑA
    ===================================-->

    <main class="forgot-container">

        <section class="forgot-card">

            <!-- Logo -->

            <div class="forgot-logo">

                <div class="logo-icon">

                    <span class="material-symbols-outlined">

                        medical_services

                    </span>

                </div>

                <h2>

                    Hospital Público<br>
                    Manolo Morales

                </h2>

            </div>

            <!-- Encabezado -->

            <header class="forgot-header">

                <h1>

                    Recuperar Contraseña

                </h1>

                <p>

                    Ingrese su correo electrónico para recibir un enlace de recuperación.

                </p>

            </header>

            <!-- Formulario -->

            <form
                id="forgotForm"
                class="forgot-form">

                <div class="form-group">

                    <label for="email">

                        Correo Electrónico

                    </label>

                    <div class="input-group">

                        <span class="material-symbols-outlined">

                            mail

                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="correo@hospital.gob.ni"
                            required>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn-send">

                    Enviar Enlace

                    <span class="material-symbols-outlined">

                        arrow_forward

                    </span>

                </button>

                                <!--==================================
                        BOTÓN
                ==================================-->

            </form>

            <!--==================================
                    FOOTER
            ==================================-->

            <footer class="forgot-footer">

                <a href="login.html">

                    <span class="material-symbols-outlined">

                        arrow_back

                    </span>

                    Volver a Iniciar Sesión

                </a>

            </footer>

        </section>

    </main>

    <script src="/assets/js/forgot-password.js"></script>

</body>

</html>
