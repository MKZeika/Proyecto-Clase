<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | Hospital Público Manolo Morales</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Material Symbols -->

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/assets/css/login.css">

</head>

<body>

    <!--==================================
            FONDO DECORATIVO
    ===================================-->

    <div class="background">

        <div class="background-circle circle-1"></div>

        <div class="background-circle circle-2"></div>

    </div>

    <!--==================================
            LOGIN
    ===================================-->

    <main class="login-container">

        <section class="login-card">

            <!-- Logo -->

            <div class="login-logo">

                <div class="logo-icon">

                    <span class="material-symbols-outlined">

                        medical_services

                    </span>

                </div>

                <h2>

                    Hospital Público<br>
                    Manolo Morales

                </h2>

            </div>

            <!-- Encabezado -->

            <header class="login-header">

                <h1>

                    Acceso al Sistema

                </h1>

                <p>

                    Ingrese sus credenciales para continuar

                </p>

            </header>

            <!-- Formulario -->

            <form
                class="login-form"
                id="loginForm">

                <!-- Usuario -->

                <div class="form-group">

                    <label for="username">

                        Correo o Usuario

                    </label>

                    <div class="input-group">

                        <span class="material-symbols-outlined">

                            person

                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="ejemplo@hospital.gob.ni"
                            required>

                    </div>

                </div>

                <!-- Contraseña -->

                <div class="form-group">

                    <label for="password">

                        Contraseña

                    </label>

                    <div class="input-group">

                        <span class="material-symbols-outlined">

                            lock

                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            <span class="material-symbols-outlined">

                                visibility_off

                            </span>

                        </button>

                    </div>

                </div>

                                <!--==================================
                        OPCIONES
                ===================================-->

                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember">

                        <span>

                            Recordarme

                        </span>

                    </label>

                    <a href="/assets/html/forgot-password.html">

                        ¿Olvidó su contraseña?

                    </a>

                </div>

                <!--==================================
                        BOTÓN
                ===================================-->

                <button
                    type="submit"
                    class="btn-login">

                    Iniciar Sesión

                </button>

            </form>

            <!--==================================
                    REGISTRO
            ===================================-->

            <footer class="login-footer">

                <p>

                    ¿No tiene una cuenta?

                    <a href="/assets/html/register.html">

                        Registrarse

                    </a>

                </p>

            </footer>

        </section>

    </main>

    <script src="/assets/js/login.js"></script>

</body>

</html>
