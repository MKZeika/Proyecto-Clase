<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear Cuenta | Hospital Público Manolo Morales</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Material Symbols -->

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/assets/css/register.css">

</head>

<body>

    <!--==================================
            FONDO
    ===================================-->

    <div class="background">

        <div class="background-circle circle-1"></div>

        <div class="background-circle circle-2"></div>

    </div>

    <!--==================================
            REGISTRO
    ===================================-->

    <main class="register-container">

        <section class="register-card">

            <!-- Logo -->

            <div class="register-logo">

                <div class="logo-icon">

                    <span class="material-symbols-outlined">

                        medical_services

                    </span>

                </div>

                <h2>

                    Hospital Público<br>
                    Manolo Morales

                </h2>

            </div>

            <!-- Encabezado -->

            <header class="register-header">

                <h1>

                    Crear Cuenta

                </h1>

                <p>

                    Complete la información para registrarse en el sistema.

                </p>

            </header>

            <!-- Formulario -->

            <form
                id="registerForm"
                class="register-form">

                <!-- Nombre -->

                <div class="form-group">

                    <label for="name">

                        Nombre Completo

                    </label>

                    <div class="input-group">

                        <span class="material-symbols-outlined">

                            person

                        </span>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Ingrese su nombre completo"
                            required>

                    </div>

                </div>

                <!-- Correo -->

                <div class="form-group">

                    <label for="email">

                        Correo Electrónico

                    </label>

                    <div class="input-group">

                        <span class="material-symbols-outlined">

                            mail

                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="correo@ejemplo.com"
                            required>

                    </div>

                </div>

                                <!-- Usuario -->

                <div class="form-group">

                    <label for="username">

                        Nombre de Usuario

                    </label>

                    <div class="input-group">

                        <span class="material-symbols-outlined">

                            badge

                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Ingrese un nombre de usuario"
                            required>

                    </div>

                </div>

                <!-- Contraseña -->

                <div class="form-group">

                    <label for="password">

                        Contraseña

                    </label>

                    <div class="input-group">

                        <span class="material-symbols-outlined">

                            lock

                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingrese una contraseña"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword">

                            <span class="material-symbols-outlined">

                                visibility_off

                            </span>

                        </button>

                    </div>

                </div>

                <!-- Confirmar contraseña -->

                <div class="form-group">

                    <label for="confirmPassword">

                        Confirmar Contraseña

                    </label>

                    <div class="input-group">

                        <span class="material-symbols-outlined">

                            lock_reset

                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Repita la contraseña"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword">

                            <span class="material-symbols-outlined">

                                visibility_off

                            </span>

                        </button>

                    </div>

                </div>

                <!-- Términos -->

                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        <span>

                            Acepto los términos y condiciones

                        </span>

                    </label>

                </div>

                <!-- Botón -->

                <button
                    type="submit"
                    class="btn-register">

                    Crear Cuenta

                </button>

            </form>

            <footer class="register-footer">

                <p>

                    ¿Ya posee una cuenta?

                    <a href="login.html">

                        Iniciar Sesión

                    </a>

                </p>

            </footer>

        </section>

    </main>

    <script src="/assets/js/register.js"></script>

</body>

</html>
